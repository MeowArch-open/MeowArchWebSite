<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <meta
      name="description"
      content="Read the MeowArch installation and usage documentation."
    >
    <meta name="theme-color" content="#eaf2ff" >
    <title>Documentation | MeowArch</title>
    <link rel="icon" href="/assets/favicon.ico" sizes="any" >
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" >
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png" >
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" >
    <link rel="stylesheet" href="/styles.css" >
  </head>
  <body class="docs-page">
    <a class="skip-link" href="#docs-frame">Skip to documentation</a>
    <div class="page-decor" aria-hidden="true">
      <span class="decor-star star-one">✦</span>
      <span class="decor-star star-two">✧</span>
      <span class="decor-star star-three">✦</span>
      <span class="decor-paw paw-one">✣</span>
      <span class="decor-paw paw-two">✣</span>
      <span class="decor-arc arc-one"></span>
      <span class="decor-arc arc-two"></span>
    </div>

    <div class="site-shell docs-shell">
      <header class="topbar">
        <a class="brand-lockup" href="/" aria-label="MeowArch home" data-i18n-aria="aria.brand">
          <span class="brand-mark-frame">
            <img src="/assets/meowarch-header-icon.png" alt="" >
          </span>
          <span class="brand-copy">
            <span class="brand-name"><span>Meow</span><strong>Arch</strong></span>
            <span class="brand-tagline" data-i18n="brand.tagline">Purrfectly Minimal Arch</span>
          </span>
        </a>

        <nav class="desktop-nav" aria-label="Primary navigation" data-i18n-aria="aria.nav">
          <a class="nav-link" href="/" data-i18n="nav.home">Home</a>
          <a class="nav-link" href="/#features" data-i18n="nav.features">Features</a>
          <a class="nav-link" href="/download.html" data-i18n="nav.download">Download</a>
          <a class="nav-link is-active" href="/docs/" aria-current="page" data-i18n="nav.docs">Docs</a>
          <a class="nav-link" href="/#community" data-i18n="nav.community">Community</a>
        </nav>

        <div class="top-actions">
          <button
            class="icon-button theme-toggle"
            type="button"
            aria-label="Switch theme"
            data-i18n-aria="aria.theme"
            aria-pressed="false"
          >
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.5"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
            </svg>
          </button>
          <a
            class="icon-button github-link"
            href="https://github.com/xingguangcuican6666/MeowArchWebSite"
            target="_blank"
            rel="noreferrer"
            aria-label="MeowArch on GitHub"
            data-i18n-aria="aria.github"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 22v-4.1c.1-1 .1-1.5-.5-2.1 3.2-.4 6.5-1.6 6.5-7A5.5 5.5 0 0 0 19.5 5c.1-.4.5-1.8-.1-3.7 0 0-1.2-.4-4 1.5a13.7 13.7 0 0 0-6.8 0c-2.8-1.9-4-1.5-4-1.5C4 3.2 4.4 4.6 4.5 5A5.5 5.5 0 0 0 3 8.8c0 5.4 3.3 6.6 6.5 7-.6.6-.6 1.1-.5 2.1V22"></path>
              <path d="M9 18c-3.5 1.6-3.5-1.8-5-2"></path>
            </svg>
          </a>
          <a class="button button-primary top-cta" href="/download.html" data-i18n="cta.get_started">Get Started</a>
          <select class="lang-select" aria-label="Language" data-i18n-aria="lang.label">
            <option value="en">English</option>
            <option value="zh-CN">中文</option>
          </select>
          <button
            class="icon-button menu-toggle"
            type="button"
            aria-label="Open navigation"
            data-i18n-aria="aria.menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="mobile-menu" id="mobile-menu" aria-hidden="true" inert>
        <a class="mobile-nav-link" href="/" data-i18n="nav.home">Home</a>
        <a class="mobile-nav-link" href="/#features" data-i18n="nav.features">Features</a>
        <a class="mobile-nav-link" href="/download.html" data-i18n="nav.download">Download</a>
        <a class="mobile-nav-link is-active" href="/docs/" aria-current="page" data-i18n="nav.docs">Docs</a>
        <a class="mobile-nav-link" href="/#community" data-i18n="nav.community">Community</a>
      </div>

      <main class="docs-frame-wrap" aria-label="MeowArch documentation">
        <p class="docs-frame-status" id="docs-frame-status" role="status" aria-live="polite">
          Loading documentation…
        </p>
        <iframe
          class="docs-frame"
          id="docs-frame"
          title="MeowArch documentation"
          tabindex="0"
        ></iframe>
        <noscript class="docs-noscript">
          JavaScript is required for the integrated documentation view.
          <a href="/docs-content/">Open the documentation directly.</a>
        </noscript>
      </main>
    </div>

    <script src="/i18n.js"></script>
    <script src="/script.js"></script>
    <script src="/docs-frame.js"></script>
  </body>
</html>
